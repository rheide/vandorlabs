buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:3.0.197'
    }
}

apply plugin: 'net.minecraftforge.gradle'
// Only edit below this line, the above code adds and enables the necessary things for Forge to be setup.
apply plugin: 'eclipse'
apply plugin: 'maven-publish'

// Local runtimes and dependency caches survive clean; only generated outputs are removed.
clean.setDelete({ file(buildDir).listFiles()?.findAll { it.name != 'tooling' } ?: [] })

// Windows Python installations normally provide python.exe rather than python3.
def pythonExecutable = project.findProperty('pythonExecutable') ?: (
        System.getProperty('os.name').toLowerCase().contains('windows') ? 'python' : 'python3')

repositories {
    maven { url = 'https://repo.mikeprimm.com/' }
}

dependencies {
    compileOnly 'us.dynmap:DynmapCoreAPI:3.7-beta-6'
}

version = '2.9'
// Forge reads @Mod.version independently of the expanded mcmod.info metadata.
def declaredModVersion = file('src/main/java/com/vandorlabs/VandorLabs.java').getText('UTF-8') =~ /public static final String VERSION = "([^"]+)";/
if (!declaredModVersion.find() || declaredModVersion.group(1) != version.toString()) {
    throw new GradleException('VandorLabs.VERSION must match the release version ' + version)
}
group = 'com.vandorlabs' // http://maven.apache.org/guides/mini/guide-naming-conventions.html
archivesBaseName = 'vandorlabs'

task compileKitSpriteChecks(type: JavaCompile) {
    dependsOn compileJava
    source = files('testclient/java/com/vandorlabs/client/KitSpriteFormatChecks.java')
    classpath = sourceSets.main.runtimeClasspath
    destinationDir = file("$buildDir/kit-sprite-checks/classes")
    sourceCompatibility = '1.8'
    targetCompatibility = '1.8'
}

task testKitSpriteFormats(type: JavaExec) {
    group = 'verification'
    description = 'Validate packaged canopy textures and removed machinery assets with the Minecraft sprite loader'
    dependsOn compileKitSpriteChecks, jar
    classpath = sourceSets.main.runtimeClasspath + files(compileKitSpriteChecks.destinationDir)
    main = 'com.vandorlabs.client.KitSpriteFormatChecks'
    doFirst { args jar.archivePath.absolutePath }
}

assemble.dependsOn testKitSpriteFormats

