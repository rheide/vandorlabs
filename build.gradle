}
assemble.dependsOn testConsoleRectangles

task compileNonRenderingChecks(type: JavaCompile) {
    dependsOn classes
    source = fileTree('testclient/java') { include '**/*.java' }
    classpath = sourceSets.main.runtimeClasspath + configurations.compileOnly
    destinationDir = file("$buildDir/non-rendering-checks/classes")
    sourceCompatibility = '1.8'
    targetCompatibility = '1.8'
    // Runtime dependency service files are not processors for these assertion fixtures.
    options.compilerArgs += ['-proc:none']
}

task testNonRendering(type: JavaExec) {
    group = 'verification'
    description = 'Check placement, surfaces, copying, ramps and trapdoor groups without a renderer'
    dependsOn compileNonRenderingChecks
    classpath = sourceSets.main.runtimeClasspath + files(compileNonRenderingChecks.destinationDir)
    main = 'com.vandorlabs.client.NonRenderingChecks'
    workingDir = file("$buildDir/non-rendering-checks")
    doFirst { workingDir.mkdirs() }
}

