// Verify the exact copy pathways in the supported external mod builds. The
// live-client suite then exercises Vandor Labs state/NBT through those boundaries.
task testCopyCompatibility(type: Exec) {
    workingDir projectDir
    commandLine pythonExecutable, 'tools/test_copy_compat.py'
    inputs.file('tools/test_copy_compat.py')
    outputs.upToDateWhen { false }
}

sourceSets {
    main {
        java {
            // Shared unchanged by every Minecraft/Forge adapter project.
            srcDir 'src/portable/java'
        }
        resources {
            srcDir 'generated-resources'
        }
    }
}

processResources.dependsOn testCopyCompatibility

// Install the chosen runtime texture tree after static resources are copied.
// Exact path matching against the archived original set prevents an incomplete
// default pack from silently dropping textures.
// Keep copying and transformation in one task: a later task modifying this
// output would invalidate processResources on every subsequent build.
processResources {
    inputs.dir('texture-packs/additional/assets/vandorlabs/textures')
    inputs.dir('texture-packs/default/assets/vandorlabs/textures')
    inputs.dir('texture-packs/original/assets/vandorlabs/textures')
    inputs.files('tools/compact_runtime_assets.py', 'tools/prune_retired_textures.py', 'tools/prune_unused_runtime_assets.py', 'tools/prune_unlisted_screen_artwork.py')
    inputs.file('tools/deduplicate_runtime_textures.py')
    inputs.file('tools/optimize_runtime_pngs.py')
    inputs.file('tools/generate_pbr_materials.py')
    inputs.file('src/main/java/com/vandorlabs/tiles/ScreenHousingTextures.java')
    inputs.file('src/portable/java/com/vandorlabs/tiles/HousingFinishCatalog.java')
    inputs.property('pythonExecutable', pythonExecutable)
    doFirst {
        // Removed source assets must not survive in an incremental JAR build.
        def stagedResources = file("$buildDir/resources/main").canonicalFile
        if (destinationDir.canonicalFile != stagedResources
                || !stagedResources.toPath().startsWith(buildDir.canonicalFile.toPath())) {
            throw new GradleException('Unexpected resource staging directory')
        }
        delete stagedResources
    }
    doLast {
        def target = file("$buildDir/resources/main/assets/vandorlabs/textures")
        def replacement = file('texture-packs/default/assets/vandorlabs/textures')
        def original = file('texture-packs/original/assets/vandorlabs/textures')
        def relativeNames = { root ->
            fileTree(root).files.collect {
                root.toPath().relativize(it.toPath()).toString().replace('\\', '/')
            } as Set
        }
        def expected = relativeNames(original)
        def supplied = relativeNames(replacement)
        if (expected != supplied) {
            def missing = (expected - supplied).sort().take(10)
            def unexpected = (supplied - expected).sort().take(10)
            throw new GradleException("default texture tree mismatch: " +
                    "${(expected - supplied).size()} missing, " +
                    "${(supplied - expected).size()} unexpected; " +
                    "missing=${missing}; unexpected=${unexpected}")
        }
        delete target
        copy {
            from replacement
            into target
        }
        copy {
            from 'texture-packs/additional/assets/vandorlabs/textures'
            into target
        }
        exec {
            commandLine pythonExecutable, 'tools/compact_runtime_assets.py', '--stage', target.parentFile, '--models-staged'
        }
        exec {
            commandLine pythonExecutable, 'tools/prune_retired_textures.py', '--stage', target.parentFile
        }
        exec {
            commandLine pythonExecutable, 'tools/prune_unused_runtime_assets.py', '--stage', target.parentFile
        }
        exec { commandLine pythonExecutable, 'tools/prune_unlisted_screen_artwork.py', '--stage', target.parentFile }
        exec {
            commandLine pythonExecutable, 'tools/generate_pbr_materials.py', '--stage', target.parentFile
        }
        exec {
            environment 'PYTHONPATH', project.file('build/tooling/python-packages').absolutePath
            commandLine pythonExecutable, 'tools/optimize_runtime_pngs.py', '--stage', target.parentFile
        }
        exec {
            commandLine pythonExecutable, 'tools/deduplicate_runtime_textures.py', '--stage', target.parentFile
        }
        logger.lifecycle("Installed ${supplied.size()} default runtime textures")
    }
}

