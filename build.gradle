task verifyRelease {
    group = 'verification'
    description = 'Validate a standard release JAR with geometry and live rendering/gameplay regressions'
    dependsOn build, testDiagonalJoins, testNonRendering, testShaderStartup
    doLast {
        def releaseJar = file("$buildDir/libs/vandorlabs-${version}.jar")
        def digest = { java.security.MessageDigest.getInstance('SHA-256').digest(releaseJar.bytes).encodeHex().toString() }
        def expectedDigest = digest()
        // Shader startup above owns OptiFine/pack inputs; the following pixel oracles use vanilla rendering.
        if (System.getProperty('os.name').toLowerCase().contains('windows')) {
            exec { environment 'VANDOR_LABS_TEST_OPTIFINE', ''; environment 'VANDOR_LABS_TEST_SHADERPACK', '';  commandLine 'python', 'testclient/run_windows.py', '--focus', 'render-regressions', '--timeout', '900' }
            exec { environment 'VANDOR_LABS_TEST_OPTIFINE', ''; environment 'VANDOR_LABS_TEST_SHADERPACK', '';  commandLine 'python', 'testclient/run_windows.py', '--focus', 'glass-appearance', '--timeout', '900' }
            exec { environment 'VANDOR_LABS_TEST_OPTIFINE', ''; environment 'VANDOR_LABS_TEST_SHADERPACK', '';  commandLine 'python', 'testclient/run_windows.py', '--shot-prefix', 'utility22_card_mounts', '--timeout', '900' }
            exec { environment 'VANDOR_LABS_TEST_OPTIFINE', ''; environment 'VANDOR_LABS_TEST_SHADERPACK', '';  commandLine 'python', 'testclient/run_windows.py', '--focus', 'fluids', '--timeout', '900' }
            exec { environment 'VANDOR_LABS_TEST_OPTIFINE', ''; environment 'VANDOR_LABS_TEST_SHADERPACK', '';  commandLine 'python', 'testclient/run_windows.py', '--focus', 'bridge-machines', '--timeout', '900' }
            exec { environment 'VANDOR_LABS_TEST_OPTIFINE', ''; environment 'VANDOR_LABS_TEST_SHADERPACK', '';  commandLine 'python', 'testclient/run_windows.py', '--focus', 'utility26', '--timeout', '900' }
            exec { environment 'VANDOR_LABS_TEST_OPTIFINE', ''; environment 'VANDOR_LABS_TEST_SHADERPACK', '';  commandLine 'python', 'testclient/run_windows.py', '--focus', 'arm-live', '--timeout', '900' }
            for (focus in ['segmented-door','coupler-articulation','ramp-axis','screen-chips','glass-migration','vehicle-render-cost','render-density','segmented-door-legacy','segmented-door-tall','furniture','vehicle-design','arm-endpoints','arm-joined','arm-riders','arm-placement','arm-wall','copy-surfaces','vehicle-ramps','vehicle-taxi']) exec { environment 'VANDOR_LABS_TEST_OPTIFINE', ''; environment 'VANDOR_LABS_TEST_SHADERPACK', '';  commandLine 'python', 'testclient/run_windows.py', '--focus', focus, '--timeout', '900' }
            if (System.getenv('VANDOR_LABS_TEST_MEKANISM')) exec { environment 'VANDOR_LABS_TEST_OPTIFINE', ''; environment 'VANDOR_LABS_TEST_SHADERPACK', '';  commandLine 'python', 'testclient/run_windows.py', '--focus', 'mekanism-tanks', '--timeout', '900' }
        } else {
            exec { environment 'VANDOR_LABS_TEST_OPTIFINE', ''; environment 'VANDOR_LABS_TEST_SHADERPACK', '';  environment 'VANDOR_LABS_TEST_HEAP', System.getenv('VANDOR_LABS_TEST_HEAP') ?: '8G'; environment 'VANDOR_LABS_TEST_SKIP_BUILD', 'true'; commandLine 'bash', 'testclient/test_viewscreen.sh', '--focus', 'render-regressions' }
            exec { environment 'VANDOR_LABS_TEST_OPTIFINE', ''; environment 'VANDOR_LABS_TEST_SHADERPACK', '';  environment 'VANDOR_LABS_TEST_HEAP', System.getenv('VANDOR_LABS_TEST_HEAP') ?: '8G'; environment 'VANDOR_LABS_TEST_SKIP_BUILD', 'true'; commandLine 'bash', 'testclient/test_viewscreen.sh', '--focus', 'glass-appearance' }
            exec { environment 'VANDOR_LABS_TEST_OPTIFINE', ''; environment 'VANDOR_LABS_TEST_SHADERPACK', '';  environment 'VANDOR_LABS_TEST_HEAP', System.getenv('VANDOR_LABS_TEST_HEAP') ?: '8G'; environment 'VANDOR_LABS_TEST_SKIP_BUILD', 'true'; commandLine 'bash', 'testclient/test_viewscreen.sh', '--focus', 'utility22_card_mounts' }
            exec { environment 'VANDOR_LABS_TEST_OPTIFINE', ''; environment 'VANDOR_LABS_TEST_SHADERPACK', '';  environment 'VANDOR_LABS_TEST_HEAP', System.getenv('VANDOR_LABS_TEST_HEAP') ?: '8G'; environment 'VANDOR_LABS_TEST_SKIP_BUILD', 'true'; commandLine 'bash', 'testclient/test_viewscreen.sh', '--focus', 'fluids' }
            exec { environment 'VANDOR_LABS_TEST_OPTIFINE', ''; environment 'VANDOR_LABS_TEST_SHADERPACK', '';  environment 'VANDOR_LABS_TEST_HEAP', System.getenv('VANDOR_LABS_TEST_HEAP') ?: '8G'; environment 'VANDOR_LABS_TEST_SKIP_BUILD', 'true'; commandLine 'bash', 'testclient/test_viewscreen.sh', '--focus', 'bridge-machines' }
            exec { environment 'VANDOR_LABS_TEST_OPTIFINE', ''; environment 'VANDOR_LABS_TEST_SHADERPACK', '';  environment 'VANDOR_LABS_TEST_HEAP', System.getenv('VANDOR_LABS_TEST_HEAP') ?: '8G'; environment 'VANDOR_LABS_TEST_SKIP_BUILD', 'true'; commandLine 'bash', 'testclient/test_viewscreen.sh', '--focus', 'utility26' }
            exec { environment 'VANDOR_LABS_TEST_OPTIFINE', ''; environment 'VANDOR_LABS_TEST_SHADERPACK', '';  environment 'VANDOR_LABS_TEST_HEAP', System.getenv('VANDOR_LABS_TEST_HEAP') ?: '8G'; environment 'VANDOR_LABS_TEST_SKIP_BUILD', 'true'; commandLine 'bash', 'testclient/test_viewscreen.sh', '--focus', 'arm-live' }
            for (focus in ['segmented-door','coupler-articulation','ramp-axis','screen-chips','glass-migration','vehicle-render-cost','render-density','segmented-door-legacy','segmented-door-tall','furniture','vehicle-design','arm-endpoints','arm-joined','arm-riders','arm-placement','arm-wall','copy-surfaces','vehicle-ramps','vehicle-taxi']) exec { environment 'VANDOR_LABS_TEST_OPTIFINE', ''; environment 'VANDOR_LABS_TEST_SHADERPACK', '';  environment 'VANDOR_LABS_TEST_HEAP', System.getenv('VANDOR_LABS_TEST_HEAP') ?: '8G'; environment 'VANDOR_LABS_TEST_SKIP_BUILD', 'true'; commandLine 'bash', 'testclient/test_viewscreen.sh', '--focus', focus }
            if (System.getenv('VANDOR_LABS_TEST_MEKANISM')) exec { environment 'VANDOR_LABS_TEST_OPTIFINE', ''; environment 'VANDOR_LABS_TEST_SHADERPACK', '';  environment 'VANDOR_LABS_TEST_HEAP', System.getenv('VANDOR_LABS_TEST_HEAP') ?: '8G'; commandLine 'bash', 'testclient/test_mekanism_tank.sh' }
        }
        if (digest() != expectedDigest) throw new GradleException('Release JAR changed during live validation')
        logger.lifecycle('Release JAR verified SHA-256: ' + expectedDigest)
    }
}
tasks.matching { it.name == 'publish' || it.name == 'publishToMavenLocal' || it.name.startsWith('publishMaven') }.all { dependsOn verifyRelease }

