// Read-only Safe Park prerequisite; no gameplay binding or release gate.
task testArmParkingPhases(type: JavaExec) {
 dependsOn compilePortableTests
 classpath = files("$buildDir/portable-tests")
 main = 'com.vandorlabs.gear.core.ArmParkingPhasesTest'
}
task testArmParkingCandidates(type: JavaExec) {
 dependsOn compileNonRenderingChecks
 classpath = sourceSets.main.runtimeClasspath + files(compileNonRenderingChecks.destinationDir)
 main = 'com.vandorlabs.gear.ArmParkingCandidatesChecks'
 maxHeapSize = '1g'
}
