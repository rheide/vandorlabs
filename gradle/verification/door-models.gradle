task testSpaceDoorModelReference(type: JavaExec) {
    group = 'verification'
    dependsOn compileNonRenderingChecks
    classpath = sourceSets.main.runtimeClasspath + files(compileNonRenderingChecks.destinationDir)
    main = 'com.vandorlabs.client.SpaceDoorModelReferenceChecks'
    if (project.hasProperty('spaceDoorModelGolden')) systemProperty 'vandorlabs.spaceDoorModelGolden', project.property('spaceDoorModelGolden')
}
