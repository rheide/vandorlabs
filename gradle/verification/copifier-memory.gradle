task testCopifierMemoryReference(type: JavaExec) {
 group = 'verification'
 dependsOn compileNonRenderingChecks
 classpath = sourceSets.main.runtimeClasspath + files(compileNonRenderingChecks.destinationDir)
 main = 'com.vandorlabs.client.CopifierMemoryLegacyChecks'
 args file("$buildDir/test-artifacts/copifier-memory-source.json").absolutePath
 maxHeapSize = '512m'
}
