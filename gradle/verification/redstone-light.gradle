task exportRedstoneLightReference(type: JavaExec) {
    group = 'verification'
    dependsOn compileNonRenderingChecks
    classpath = sourceSets.main.runtimeClasspath + files(compileNonRenderingChecks.destinationDir)
    main = 'com.vandorlabs.client.RedstoneLightLegacyOracle'
    args file('build/test-artifacts/redstone-light-forge.jsonl').absolutePath
}
