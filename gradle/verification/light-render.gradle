task exportLightRenderReference(type: JavaExec) {
    group = 'verification'
    dependsOn compileNonRenderingChecks
    classpath = sourceSets.main.runtimeClasspath + files(compileNonRenderingChecks.destinationDir)
    main = 'com.vandorlabs.client.LightRenderLegacyOracle'
    args file('build/test-artifacts/light-render-forge.jsonl').absolutePath
}

task testGlassMappingCache(type: JavaExec) {
    group = 'verification'
    dependsOn compileNonRenderingChecks
    classpath = sourceSets.main.runtimeClasspath + files(compileNonRenderingChecks.destinationDir)
    main = 'com.vandorlabs.client.GlassMappingCacheChecks'
    if (project.hasProperty('glassMappingBaseline')) args 'baseline'
}

task testLightSharedRender(type: JavaExec) {
    group = 'verification'
    dependsOn compileNonRenderingChecks
    classpath = sourceSets.main.runtimeClasspath + files(compileNonRenderingChecks.destinationDir)
    main = 'com.vandorlabs.client.LightRenderLegacyOracle'
    args file('build/test-artifacts/light-render-shared.jsonl').absolutePath, 'shared'
}

task exportLightArtworkReference(type: JavaExec) {
    group = 'verification'
    dependsOn compileNonRenderingChecks
    classpath = sourceSets.main.runtimeClasspath + files(compileNonRenderingChecks.destinationDir)
    main = 'com.vandorlabs.client.LightArtworkLegacyOracle'
    args file('build/test-artifacts/light-artwork-forge.json').absolutePath
}

task testLightHousingDensity(type: JavaExec) {
    group = 'verification'
    dependsOn compileNonRenderingChecks
    classpath = sourceSets.main.runtimeClasspath + files(compileNonRenderingChecks.destinationDir)
    main = 'com.vandorlabs.client.LightHousingDensityChecks'
}

// Preserve mixed dense-light lookup coverage when the existing render contract runs.
testLightSharedRender.dependsOn testLightHousingDensity
