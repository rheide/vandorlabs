task testCarriedDoorSecurity(type: JavaExec) {
    group = 'verification'
    description = 'Check carried and native secure-door authority, credential ownership, deadlines and saved snapshots'
    dependsOn compileNonRenderingChecks
    classpath = sourceSets.main.runtimeClasspath + files(compileNonRenderingChecks.destinationDir)
    main = 'com.vandorlabs.client.CarriedDoorSecurityChecks'
    workingDir = file("$buildDir/non-rendering-checks")
    maxHeapSize = '1g'
    doFirst { workingDir.mkdirs() }
}
check.dependsOn testCarriedDoorSecurity
