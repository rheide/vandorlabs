task exportCredentialReaderReference(type: JavaExec) {
    dependsOn compileNonRenderingChecks
    classpath = sourceSets.main.runtimeClasspath + files(compileNonRenderingChecks.destinationDir)
    main = 'com.vandorlabs.client.CredentialReaderLegacyChecks'
    systemProperty 'vandorlabs.credentialReaderReference', file(project.findProperty('credentialReaderReference') ?: 'build/test-artifacts/credential-reader-forge.json').absolutePath
}

task exportStandaloneReaderReference(type: JavaExec) {
    dependsOn compileNonRenderingChecks
    maxHeapSize = '1g'
