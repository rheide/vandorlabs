task exportScreenItemReference(type: JavaExec) {
    dependsOn compileNonRenderingChecks
    classpath = sourceSets.main.runtimeClasspath + files(compileNonRenderingChecks.destinationDir)
    main = 'com.vandorlabs.client.ScreenItemLegacyChecks'
}
task exportScreenConfiguredPlacementReference(type: JavaExec) {
    dependsOn compileNonRenderingChecks
    classpath = sourceSets.main.runtimeClasspath + files(compileNonRenderingChecks.destinationDir)
    main = 'com.vandorlabs.client.ScreenConfiguredPlacementLegacyChecks'
    maxHeapSize = '1G'
}
