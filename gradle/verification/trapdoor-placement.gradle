    classpath = sourceSets.main.runtimeClasspath + files(compileNonRenderingChecks.destinationDir)
    main = 'com.vandorlabs.client.TrapdoorContactPlacementLegacyOracle'
    maxHeapSize = '1G'
    args file(project.findProperty('trapdoorContactPlacementReference') ?: 'build/test-artifacts/trapdoor-contact-placement-forge.jsonl').absolutePath
}
