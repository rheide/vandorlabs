task exportScreenEmissionReference(type: JavaExec) {
    group = 'verification'
    dependsOn compileNonRenderingChecks
    classpath = sourceSets.main.runtimeClasspath + files(compileNonRenderingChecks.destinationDir)
    main = 'com.vandorlabs.client.ScreenEmissionLegacyOracle'
    args file('build/test-artifacts/screen-emission-forge.jsonl').absolutePath
}

task testScreenSharedEmission(type: JavaExec) {
    group = 'verification'
    dependsOn compileNonRenderingChecks
    classpath = sourceSets.main.runtimeClasspath + files(compileNonRenderingChecks.destinationDir)
    main = 'com.vandorlabs.client.ScreenEmissionLegacyOracle'
    args file('build/test-artifacts/screen-emission-shared.jsonl').absolutePath, 'shared'
}

// Separate test companion; never packaged into the standard mod.
task screenRoleOracleJar(type: Jar) {
    dependsOn compileNonRenderingChecks
    classifier = 'screen-role-oracle'
    from(compileNonRenderingChecks.destinationDir) {
        include 'com/vandorlabs/client/ScreenRoleGLOracle*.class'
        include 'com/vandorlabs/client/ScreenRowsGLOracle*.class'
        include 'com/vandorlabs/client/ScreenJournalGLOracle*.class'
        include 'com/vandorlabs/client/ScreenChipTrayGLOracle*.class'
        include 'com/vandorlabs/client/ScreenJoinedJournalGLOracle*.class'
    }
}
reobf { screenRoleOracleJar {} }

