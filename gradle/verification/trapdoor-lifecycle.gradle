task exportTrapdoorLifecycleReference(type: JavaExec) {
    group = 'verification'
    dependsOn compileNonRenderingChecks
    classpath = sourceSets.main.runtimeClasspath + files(compileNonRenderingChecks.destinationDir)
    main = 'com.vandorlabs.client.TrapdoorLifecycleLegacyChecks'
    args file(project.findProperty('trapdoorLifecycleReference') ?: 'build/test-artifacts/trapdoor-lifecycle-forge.json').absolutePath
}
