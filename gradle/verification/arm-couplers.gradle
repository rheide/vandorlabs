// Geometry-only admission; does not change existing arm endpoint ownership.
task testArmGridMapping(type: JavaExec) {
 dependsOn compileNonRenderingChecks
 classpath = sourceSets.main.runtimeClasspath + files(compileNonRenderingChecks.destinationDir)
 main = 'com.vandorlabs.gear.ArmGridMappingChecks'
 maxHeapSize = '512m'
}

task testCouplerLineConstraint(type: JavaExec) {
 dependsOn compilePortableTests
 classpath = files("$buildDir/portable-tests")
 main = 'com.vandorlabs.physics.CouplerLineConstraintTest'
}

task testArmCouplerHeads(type: JavaExec) {
 dependsOn compileNonRenderingChecks
 classpath = sourceSets.main.runtimeClasspath + files(compileNonRenderingChecks.destinationDir)
 main = 'com.vandorlabs.vehicle.ArmCouplerHeadChecks'
 maxHeapSize = '1g'
}
