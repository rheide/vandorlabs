task exportProgrammableLightReference(type: JavaExec) {
    group = 'verification'
    dependsOn compileNonRenderingChecks
    classpath = sourceSets.main.runtimeClasspath + files(compileNonRenderingChecks.destinationDir)
    main = 'com.vandorlabs.client.ProgrammableLightLegacyChecks'
    maxHeapSize = '1G'
    args file('build/test-artifacts/programmable-light').absolutePath
}
task exportLightJoiningReference(type: JavaExec) {
    group = 'verification'
    dependsOn compileNonRenderingChecks
    classpath = sourceSets.main.runtimeClasspath + files(compileNonRenderingChecks.destinationDir)
    main = 'com.vandorlabs.client.LightJoiningLegacyChecks'
    maxHeapSize = '1G'
    args file('build/test-artifacts/light-joining-forge.jsonl').absolutePath
}
task testLightInputSampling(type: JavaExec) {
    dependsOn compileNonRenderingChecks
    classpath = sourceSets.main.runtimeClasspath + files(compileNonRenderingChecks.destinationDir)
    main = 'com.vandorlabs.client.LightSamplingChecks'
}
