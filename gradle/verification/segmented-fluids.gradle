task exportSegmentedFluidReference(type: JavaExec) {
    dependsOn compileNonRenderingChecks
    classpath = sourceSets.main.runtimeClasspath + files(compileNonRenderingChecks.destinationDir)
    main = 'com.vandorlabs.client.SegmentedFluidLegacyChecks'
    maxHeapSize = '1G'
    systemProperty 'vandorlabs.segmentedFluidReference', file('build/test-artifacts/segmented-fluid').absolutePath
}
