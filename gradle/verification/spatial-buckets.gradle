task testLoadedTileBucketReference(type: JavaExec) {
    group = 'verification'
    dependsOn compileNonRenderingChecks
    classpath = sourceSets.main.runtimeClasspath + files(compileNonRenderingChecks.destinationDir)
    main = 'com.vandorlabs.client.LoadedTileBucketReferenceChecks'
    if (project.hasProperty('spatialBucketGolden')) systemProperty 'vandorlabs.spatialBucketGolden', project.property('spatialBucketGolden')
}
