task exportCanopyContactReference(type: JavaExec) {
 group='verification'
 dependsOn compileNonRenderingChecks
 classpath=sourceSets.main.runtimeClasspath+files(compileNonRenderingChecks.destinationDir)
 main='com.vandorlabs.client.CanopyContactLegacyOracle'
 args file("$buildDir/test-artifacts/canopy-contact-source.jsonl").absolutePath
 maxHeapSize='768m'
}
