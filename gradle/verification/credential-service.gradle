task testCredentialFilterLegacy(type: JavaExec) {
    dependsOn compileNonRenderingChecks
    classpath = sourceSets.main.runtimeClasspath + files(compileNonRenderingChecks.destinationDir)
    main = 'com.vandorlabs.client.CredentialFilterLegacyChecks'
}

task exportCredentialStackReference(type: JavaExec) {
    dependsOn compileNonRenderingChecks
    classpath = sourceSets.main.runtimeClasspath + files(compileNonRenderingChecks.destinationDir)
    main = 'com.vandorlabs.client.CredentialStackLegacyChecks'
    systemProperty 'vandorlabs.credentialStackReference', file(project.findProperty('credentialStackReference') ?: 'build/test-artifacts/credential-stack-forge.json').absolutePath
}
