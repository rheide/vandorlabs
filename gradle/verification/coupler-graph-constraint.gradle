// Continuous scalar solver only: no runtime articulation or ownership installation.
task testCouplerGraphConstraint(type: JavaExec) {
 dependsOn compilePortableTests
 classpath=files(compilePortableTests.destinationDir)
 main='com.vandorlabs.physics.CouplerGraphConstraintTest'
 maxHeapSize='512m'
}
task testVehicleArmConstraintModel(type: JavaExec) {
 dependsOn compileNonRenderingChecks
