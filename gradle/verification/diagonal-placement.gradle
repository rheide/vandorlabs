task exportDiagonalPlacementReference(type: JavaExec) {
    dependsOn compileNonRenderingChecks
    classpath = sourceSets.main.runtimeClasspath + files(compileNonRenderingChecks.destinationDir)
    main = 'com.vandorlabs.client.DiagonalPlacementLegacyOracle'
    args file('build/test-artifacts/diagonal-placement-forge.json').absolutePath
}
