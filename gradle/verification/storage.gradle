    group = 'verification'
    dependsOn compileNonRenderingChecks
    classpath = sourceSets.main.runtimeClasspath + files(compileNonRenderingChecks.destinationDir)
    main = 'com.vandorlabs.client.StorageItemModelLegacyOracle'
    args file('build/test-artifacts/storage-item-content-source-reference.jsonl').absolutePath, '--content-aspects'
    maxHeapSize = '1G'
}
