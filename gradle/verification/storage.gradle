task exportStorageSourceReference(type: JavaExec) {
    group = 'verification'
    dependsOn compileNonRenderingChecks
    classpath = sourceSets.main.runtimeClasspath + files(compileNonRenderingChecks.destinationDir)
    main = 'com.vandorlabs.client.StorageLegacyChecks'
    maxHeapSize = '1G'
}

task exportStorageItemSourceReference(type: JavaExec) {
    group = 'verification'
    dependsOn compileNonRenderingChecks
    classpath = sourceSets.main.runtimeClasspath + files(compileNonRenderingChecks.destinationDir)
    main = 'com.vandorlabs.client.StorageItemLegacyChecks'
    maxHeapSize = '1G'
}

// Separate corpus preserves the accepted baseline reference hashes.
task exportStorageDuplicateSourceReference(type: JavaExec) {
    group = 'verification'
    dependsOn compileNonRenderingChecks
    classpath = sourceSets.main.runtimeClasspath + files(compileNonRenderingChecks.destinationDir)
    main = 'com.vandorlabs.client.StorageDuplicateLegacyChecks'
    maxHeapSize = '1G'
}
