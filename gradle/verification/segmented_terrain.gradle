task exportSegmentedTerrainReference(type: JavaExec) {
    group = 'verification'
    dependsOn compileNonRenderingChecks
    classpath = sourceSets.main.runtimeClasspath + files(compileNonRenderingChecks.destinationDir)
    main = 'com.vandorlabs.client.SegmentedTerrainLegacyChecks'
    args file('build/test-artifacts/segmented-terrain-forge.jsonl').absolutePath
}

