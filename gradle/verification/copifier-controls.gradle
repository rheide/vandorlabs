task testCopifierControlReference(type: JavaExec) {
 group = 'verification'
 dependsOn compileNonRenderingChecks
 classpath = sourceSets.main.runtimeClasspath + files(compileNonRenderingChecks.destinationDir)
 main = 'com.vandorlabs.client.CopifierControlLegacyChecks'
 args file("$buildDir/test-artifacts/copifier-controls-source.json").absolutePath
 maxHeapSize = '1g'
}
