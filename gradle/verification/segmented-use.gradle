task exportSegmentedUseReference(type: JavaExec) {
    group = 'verification'
    dependsOn compileNonRenderingChecks
    classpath = sourceSets.main.runtimeClasspath + files(compileNonRenderingChecks.destinationDir)
    main = 'com.vandorlabs.client.SegmentedUseLegacyChecks'
    args file('build/test-artifacts/segmented-use-forge.json').absolutePath
}
