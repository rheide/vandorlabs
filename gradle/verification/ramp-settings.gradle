task exportRampSettingsSourceReference(type: JavaExec) {
 group='verification'
 dependsOn compileNonRenderingChecks
 classpath=sourceSets.main.runtimeClasspath+files(compileNonRenderingChecks.destinationDir)
 main='com.vandorlabs.client.RampSettingsLegacyOracle'
 args file("$buildDir/test-artifacts/ramp-settings-source.jsonl").absolutePath
 maxHeapSize='1G'
}
task exportRampCallbacksSourceReference(type: JavaExec) {
 group='verification'
 dependsOn compileNonRenderingChecks
 classpath=sourceSets.main.runtimeClasspath+files(compileNonRenderingChecks.destinationDir)
 main='com.vandorlabs.client.RampCallbacksLegacyOracle'
 args file("$buildDir/test-artifacts/ramp-callbacks-source.jsonl").absolutePath
 maxHeapSize='1G'
}
