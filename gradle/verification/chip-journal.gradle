task exportChipJournalReference(type: JavaExec) {
    dependsOn compileNonRenderingChecks
    classpath = sourceSets.main.runtimeClasspath + files(compileNonRenderingChecks.destinationDir)
    main = 'com.vandorlabs.client.ChipJournalLegacyChecks'
    jvmArgs '-Xmx512M'
}
task exportEmbeddedChipReference(type: JavaExec) {
    dependsOn compileNonRenderingChecks
    classpath = sourceSets.main.runtimeClasspath + files(compileNonRenderingChecks.destinationDir)
    main = 'com.vandorlabs.client.EmbeddedChipLegacyChecks'
    maxHeapSize = '512M'
}
