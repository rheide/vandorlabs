task testSegmentedSettingsLegacy(type: JavaExec) {
 dependsOn compileNonRenderingChecks
 classpath = sourceSets.main.runtimeClasspath + files(compileNonRenderingChecks.destinationDir)
 main = 'com.vandorlabs.client.SegmentedSettingsLegacyChecks'
}
task testSegmentedWindowsLegacy(type: JavaExec) {
 dependsOn compileNonRenderingChecks
 classpath = sourceSets.main.runtimeClasspath + files(compileNonRenderingChecks.destinationDir)
 main = 'com.vandorlabs.client.SegmentedWindowsLegacyChecks'
}
task exportSegmentedLifecycleReference(type: JavaExec) {
 dependsOn compileNonRenderingChecks
 classpath = sourceSets.main.runtimeClasspath + files(compileNonRenderingChecks.destinationDir)
 main = 'com.vandorlabs.client.SegmentedLifecycleLegacyChecks'
 systemProperty 'vandorlabs.segmentedLifecycleReference',file(project.findProperty('segmentedLifecycleReference') ?: 'build/test-artifacts/segmented-lifecycle-forge.jsonl').absolutePath
}
