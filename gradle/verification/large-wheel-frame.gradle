task testLargeWheelComponentFrame(type: JavaExec) {
    dependsOn compileNonRenderingChecks
    classpath = sourceSets.main.runtimeClasspath + files(compileNonRenderingChecks.destinationDir)
    main = 'com.vandorlabs.gear.LargeWheelFrameChecks'
    maxHeapSize = '512m'
}
check.dependsOn testLargeWheelComponentFrame

