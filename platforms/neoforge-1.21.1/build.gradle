plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
group = 'com.vandorlabs'
version = (file('../../build.gradle').text =~ /(?m)^version\s*=\s*'([^']+)'/)[0][1]
base { archivesName = 'vandorlabs-neoforge-1.21.1' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
sourceSets.main.java.srcDir('../../src/portable/java')
sourceSets.main.resources.srcDir('build/generated/matter-resources')
sourceSets.main.resources.srcDir('build/generated/cube-resources')
sourceSets {
    smoke {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
neoForge {
    version = '21.1.264'
    runs {
        client {
            client(); gameDirectory = file(project.findProperty('modernClientRunDirectory') ?: 'run/bootstrap-client')
            if (project.hasProperty('matterClientPort')) programArguments.addAll '--quickPlayMultiplayer', ('127.0.0.1:' + project.property('matterClientPort')), '--width', '1280', '--height', '720'
        }
        server { server(); programArgument '--nogui'; gameDirectory = file(project.findProperty('modernServerRunDirectory') ?: 'run/bootstrap-server') }
    }
    mods { vandorlabs { sourceSet(sourceSets.main); sourceSet(sourceSets.smoke) } }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('processResources') {
    inputs.property('modVersion', project.version)
    filesMatching('META-INF/neoforge.mods.toml') { expand(modVersion: project.version) }
}
def pythonExecutable = project.findProperty('pythonExecutable') ?: (
    System.getProperty('os.name').toLowerCase().contains('windows') ? 'python' : 'python3')
tasks.register('testPortableContracts', Exec) {
    workingDir projectDir
    commandLine pythonExecutable, '../../tools/test_portable.py', '--jdk', '21', '--report', file('build/reports/portable-java21.json').absolutePath
}
tasks.named('check') { dependsOn 'testPortableContracts' }
// SecureJarHandler requires the modular ASM release used by this runtime.
configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.ow2.asm') details.useVersion('9.8')
    }
}
tasks.named('jar') {
    from('../../LICENSE') { into 'META-INF' }
    from('../../THIRD_PARTY_NOTICES.md') { into 'META-INF' }
}

tasks.register('generateMatterResources', Exec) {
    workingDir projectDir
    commandLine pythonExecutable, 'generate_matter_resources.py'
    inputs.file('generate_matter_resources.py')
    inputs.file('../../tools/compact_runtime_assets.py')
    inputs.dir('../../src/main/resources/assets/vandorlabs/models')
    inputs.dir('../../src/main/resources/assets/vandorlabs/recipes')
    inputs.file('../../generated-resources/assets/vandorlabs/lang/en_us.lang')
    inputs.file('../../texture-packs/additional/assets/vandorlabs/textures/blocks/matter/matter.png')
    inputs.file('../../texture-packs/default/assets/vandorlabs/textures/items/programmable_matter_ingot.png')
    inputs.file('../../texture-packs/default/assets/vandorlabs/textures/items/industrial_alloy_ingot.png')
    outputs.dir('build/generated/matter-resources')
}
tasks.named('processResources') { dependsOn 'generateMatterResources' }
neoForge.runs.configureEach {
    if (project.hasProperty('matterPhase')) systemProperty 'vandorlabs.matterPhase', project.property('matterPhase')
}

tasks.register('generateCubeResources', Exec) {
    workingDir projectDir
    commandLine pythonExecutable, 'generate_cube_resources.py'
    inputs.file('generate_cube_resources.py')
    inputs.file('material_playback_resources.py')
    inputs.file('generate_panel_resources.py')
    inputs.file('../../src/portable/java/com/vandorlabs/tiles/GlassTextures.java')
    inputs.files(fileTree('../../texture-packs') { include '**/programmable_glass/low/*.png', '**/programmable_glass/medium/*.png' })
    inputs.files('../../generated-resources/assets/vandorlabs/data/blocks.json','../../generated-resources/assets/vandorlabs/data/input_surfaces.json')
    inputs.file('frame_edge_pixels.py')
    inputs.file('generate_mounted_control_resources.py')
    inputs.file('generate_wireless_resources.py')
    inputs.files(fileTree('../../src/main/resources/assets/vandorlabs/models') { include 'block/redstone_transmitter.json', 'block/redstone_receiver.json', 'item/redstone_transmitter_block.json', 'item/redstone_receiver_block.json' })
    inputs.files('../../src/main/resources/assets/vandorlabs/blockstates/redstone_transmitter_block.json', '../../src/main/resources/assets/vandorlabs/blockstates/redstone_receiver_block.json')
    inputs.files(fileTree('../../src/main/resources/assets/vandorlabs/models') { include 'block/push_button/**', 'block/rocker_switch/**', 'item/push_button.json', 'item/rocker_switch.json' })
    inputs.files('../../src/main/resources/assets/vandorlabs/blockstates/push_button.json', '../../src/main/resources/assets/vandorlabs/blockstates/rocker_switch.json')
    inputs.files('../../src/main/resources/assets/vandorlabs/recipes/push_button.json', '../../src/main/resources/assets/vandorlabs/recipes/rocker_switch.json')
    inputs.files(fileTree('../../src/main/resources/assets/vandorlabs/models') { include 'block/*power_lever*.json', 'block/twin_power_levers/**', 'item/*power_lever.json' })
    inputs.files(fileTree('../../src/main/resources/assets/vandorlabs/blockstates') { include '*power_lever.json' })
    inputs.files('../../src/main/resources/assets/vandorlabs/recipes/industrial_power_lever.json', '../../src/main/resources/assets/vandorlabs/recipes/small_power_lever.json')
    inputs.files(fileTree('../../src/main/resources/assets/vandorlabs/models') { include 'block/thruster_controls/**', 'block/aircraft_throttles/**', 'item/thruster_lever.json', 'item/*throttle.json', 'item/wall_slider.json' })
    inputs.files(fileTree('../../src/main/resources/assets/vandorlabs/blockstates') { include 'thruster_lever.json', '*throttle.json', 'wall_slider.json' })
    inputs.files('../../src/main/resources/assets/vandorlabs/recipes/thruster_lever.json', '../../src/main/resources/assets/vandorlabs/recipes/wall_slider.json')
    inputs.file('../../src/portable/java/com/vandorlabs/tiles/HousingFinishCatalog.java')
    inputs.dir('../../texture-packs')
    inputs.file('../../src/main/resources/assets/vandorlabs/data/texture_menu.json')
    inputs.file('../../generated-resources/assets/vandorlabs/data/unified_textures.json')
    inputs.file('../../src/main/resources/assets/vandorlabs/models/item/programmable_block.json')
    inputs.file('../../src/main/resources/assets/vandorlabs/recipes/programmable_block.json')
    inputs.file('../../src/main/resources/assets/vandorlabs/recipes/programmable_trigger_block.json')
    inputs.file('../../src/main/resources/assets/vandorlabs/recipes/configurizer.json')
    inputs.file('../../generated-resources/assets/vandorlabs/lang/en_us.lang')
    outputs.dir('build/generated/cube-resources')
}
tasks.named('generateCubeResources') { inputs.file('generate_shape_gameplay_resources.py'); inputs.files('../../src/main/resources/assets/vandorlabs/recipes/programmable_slab.json','../../src/main/resources/assets/vandorlabs/recipes/programmable_stairs.json') }
tasks.named('processResources') { dependsOn 'generateCubeResources' }
neoForge.runs.configureEach {
    if(project.hasProperty('cubePhase'))systemProperty 'vandorlabs.cubePhase',project.property('cubePhase')
}

neoForge.runs.configureEach {
    if(project.hasProperty('cubeReference'))systemProperty 'vandorlabs.cubeReference',project.property('cubeReference')
}
sourceSets.smoke.resources.srcDir('build/generated/cube-smoke-resources')
tasks.register('generateCubeSmokeResources', Exec) {
    commandLine pythonExecutable, 'generate_cube_smoke_resources.py'
    inputs.file('generate_cube_smoke_resources.py')
    if(project.hasProperty('cubeReference'))inputs.file(project.property('cubeReference'))
    outputs.upToDateWhen { false }
}
tasks.named('processSmokeResources') { dependsOn 'generateCubeSmokeResources' }
neoForge.runs.configureEach {
    if(project.hasProperty('filesystemPhase'))systemProperty 'vandorlabs.filesystemPhase',project.property('filesystemPhase')
    if(project.hasProperty('filesystemPeer'))systemProperty 'vandorlabs.filesystemPeer',project.property('filesystemPeer')
}

// Only this compatibility manifest is shared; do not import the legacy resource tree.
tasks.named('processResources') {
    from('../../src/main/resources') { include 'assets/vandorlabs/data/legacy_vanilla_blocks.tsv' }
}
tasks.register('testLegacyVanillaMaterialAliases', JavaExec) {
    group = 'verification'
    description = 'Check saved material aliases using actual Minecraft flattening and current data fixers'
    dependsOn 'smokeClasses'
    classpath = sourceSets.smoke.runtimeClasspath
    mainClass = 'com.vandorlabs.neoforge.LegacyVanillaMaterialAliasChecks'
}
tasks.named('check') { dependsOn 'testLegacyVanillaMaterialAliases' }
neoForge.runs.configureEach {
    if(project.hasProperty('materialSpriteAssessment'))systemProperty 'vandorlabs.materialSpriteAssessment',project.property('materialSpriteAssessment')
}

sourceSets.main.resources.srcDir('build/generated/transmitter-resources')
tasks.register('generateTransmitterResources', Exec) {
    commandLine pythonExecutable, 'generate_transmitter_resources.py'
    inputs.file('generate_transmitter_resources.py')
    inputs.files(fileTree('../../src/main/resources/assets/vandorlabs/recipes') { include 'redstone_transmitter_*.json' })
    inputs.files('../../texture-packs/additional/assets/vandorlabs/textures/items/redstone_transmitter_short.png', '../../texture-packs/additional/assets/vandorlabs/textures/items/redstone_transmitter_medium.png', '../../texture-packs/additional/assets/vandorlabs/textures/items/redstone_transmitter_long.png', '../../texture-packs/additional/assets/vandorlabs/textures/items/redstone_transmitter_infinite.png')
    outputs.dir('build/generated/transmitter-resources')
}
tasks.named('processResources') { dependsOn 'generateTransmitterResources' }
neoForge.runs.configureEach {
    if(project.hasProperty('signalLegacyReference'))systemProperty 'vandorlabs.signalLegacyReference',project.property('signalLegacyReference')
    if(project.hasProperty('wirelessLegacyReference'))systemProperty 'vandorlabs.wirelessLegacyReference',project.property('wirelessLegacyReference')
    if(project.hasProperty('binaryLegacyReference'))systemProperty 'vandorlabs.binaryLegacyReference',project.property('binaryLegacyReference')
    if(project.hasProperty('transmitterPhase'))systemProperty 'vandorlabs.transmitterPhase',project.property('transmitterPhase')
}
neoForge.runs.configureEach {
    if(project.hasProperty('sampledMaterialPhase'))systemProperty 'vandorlabs.sampledMaterialPhase',project.property('sampledMaterialPhase')
}

sourceSets {
    copySmoke {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
tasks.register('copySmokeJar', Jar) {
    dependsOn tasks.named('compileCopySmokeJava')
    archiveClassifier = 'copy-smoke'
    destinationDirectory = file("$buildDir/test-fixtures")
    from sourceSets.copySmoke.output
}
neoForge.runs.configureEach {
    if(project.hasProperty('copyJar')) {
        loadedMods.set([])
        systemProperty 'vandorlabs.copyJar', project.property('copyJar')
        systemProperty 'vandorlabs.copySha', project.property('copySha')
    }
}

tasks.register('testSignalControlPoses', JavaExec) {
    dependsOn tasks.named('compileSmokeJava')
    classpath = sourceSets.smoke.runtimeClasspath
    mainClass = 'com.vandorlabs.neoforge.SignalControlPosesChecks'
}

neoForge.runs.configureEach {
    if (project.hasProperty('fluidSlotsReference')) systemProperty 'vandorlabs.fluidSlotsReference', file(project.property('fluidSlotsReference')).absolutePath
}

tasks.register('testNativeFluidVolume', JavaExec) {
    dependsOn tasks.named('compileSmokeJava')
    classpath = sourceSets.smoke.runtimeClasspath
    mainClass = 'com.vandorlabs.neoforge.NativeFluidVolumeChecks'
}
tasks.register('testNativeStairGeometry', JavaExec) {
    group = 'verification'
    description = 'Compare native stair collision and face projections with frozen current Forge coordinates'
    dependsOn tasks.named('compileSmokeJava')
    classpath = sourceSets.smoke.runtimeClasspath
    mainClass = 'com.vandorlabs.neoforge.NativeStairGeometryChecks'
}
tasks.named('check') { dependsOn 'testNativeStairGeometry' }
neoForge.runs.configureEach {
    if (project.hasProperty('stairReference')) systemProperty 'vandorlabs.stairReference', file(project.property('stairReference')).absolutePath
    if (project.hasProperty('shapeDefaultsReference')) systemProperty 'vandorlabs.shapeDefaultsReference', file(project.property('shapeDefaultsReference')).absolutePath
}

sourceSets.main.resources.srcDir('build/generated/shape-resources')
tasks.register('generateShapeResources', Exec) {
    commandLine pythonExecutable, 'generate_shape_resources.py'
    inputs.file('generate_shape_resources.py')
    inputs.files(fileTree('../../src/main/resources/assets/vandorlabs/blockstates') { include 'programmable_slab.json', 'programmable_stairs.json' })
    inputs.files(fileTree('../../src/main/resources/assets/vandorlabs/models/block') { include 'programmable_slab.json', 'programmable_stairs_*.json' })
    inputs.files('../../src/main/resources/assets/vandorlabs/models/item/programmable_stairs.json', '../../src/main/resources/assets/vandorlabs/models/item/configured/programmable_slab_dark_wall_panel_tile.json')
    outputs.dir('build/generated/shape-resources')
}
tasks.named('processResources') { dependsOn 'generateShapeResources' }

tasks.register('testNativeHousingQuads', JavaExec) {
    group = 'verification'
    description = 'Compare CPU native shape records with an actual frozen Forge texture reference'
    dependsOn tasks.named('compileSmokeJava')
    classpath = sourceSets.smoke.runtimeClasspath
    mainClass = 'com.vandorlabs.neoforge.NativeHousingQuadChecks'
    if (project.hasProperty('shapeTextureReference')) systemProperty 'vandorlabs.shapeTextureReference', file(project.property('shapeTextureReference')).absolutePath
}

tasks.register('testNativeFluidSurface', JavaExec) {
    dependsOn tasks.named('compileSmokeJava')
    classpath = sourceSets.smoke.runtimeClasspath
    mainClass = 'com.vandorlabs.neoforge.NativeFluidSurfaceChecks'
}

tasks.register('testNativeShapeModels', JavaExec) {
    group = 'verification'
    description = 'Check native housing model and item projections against frozen actual Forge source quads'
    dependsOn tasks.named('compileSmokeJava')
    classpath = sourceSets.smoke.runtimeClasspath
    mainClass = 'com.vandorlabs.neoforge.NativeShapeModelChecks'
    if (project.hasProperty('shapeTextureReference')) systemProperty 'vandorlabs.shapeTextureReference', file(project.property('shapeTextureReference')).absolutePath
}

tasks.register('testNativeFlatWallGeometry', JavaExec) {
    dependsOn tasks.named('compileSmokeJava')
    classpath = sourceSets.smoke.runtimeClasspath
    mainClass = 'com.vandorlabs.neoforge.NativeFlatWallGeometryChecks'
}
tasks.register('testNativeBucketContext', JavaExec) {
    dependsOn tasks.named('compileSmokeJava')
    classpath = sourceSets.smoke.runtimeClasspath
    mainClass = 'com.vandorlabs.neoforge.NativeBucketContextChecks'
}

neoForge.runs.configureEach {
    if (project.hasProperty('wallFrameReference')) systemProperty 'vandorlabs.wallFrameReference', file(project.property('wallFrameReference')).absolutePath
}
tasks.register('testNativeFluidRegions', JavaExec) {
    dependsOn tasks.named('compileSmokeJava')
    classpath = sourceSets.smoke.runtimeClasspath
    mainClass = 'com.vandorlabs.neoforge.NativeFluidRegionChecks'
    systemProperty 'vandorlabs.flatFluidReference', file(project.findProperty('flatFluidReference') ?: '../../build/test-artifacts/flat-fluid-forge-reference.json').absolutePath
}

tasks.register('testNativeFluidLight', JavaExec) {
    dependsOn tasks.named('compileSmokeJava')
    classpath = sourceSets.smoke.runtimeClasspath
    mainClass = 'com.vandorlabs.neoforge.NativeFluidLightChecks'
}

neoForge.runs.configureEach {
    if (project.hasProperty('panelGlassReference')) systemProperty 'vandorlabs.panelGlassReference', file(project.property('panelGlassReference')).absolutePath
}
tasks.register('testNativeFluidPublication', JavaExec) {
    dependsOn tasks.named('compileSmokeJava')
    classpath = sourceSets.smoke.runtimeClasspath
    mainClass = 'com.vandorlabs.neoforge.fluid.NativeFluidPublicationChecks'
}

sourceSets.main.resources.srcDir('build/generated/panel-resources')
tasks.register('generatePanelResources', Exec) {
    commandLine pythonExecutable, 'generate_panel_resources.py'
    inputs.files('generate_panel_resources.py', 'generate_shape_resources.py')
    inputs.file('../../src/main/resources/assets/vandorlabs/recipes/programmable_wall.json')
    inputs.files('../../src/main/resources/assets/vandorlabs/blockstates/programmable_wall.json', '../../src/main/resources/assets/vandorlabs/models/block/programmable_wall.json', '../../src/main/resources/assets/vandorlabs/models/item/programmable_wall.json')
    outputs.dir('build/generated/panel-resources')
}
tasks.named('processResources') { dependsOn 'generatePanelResources' }

tasks.register('testNativeFlatWallModels', JavaExec) {
    group = 'verification'
    dependsOn tasks.named('compileSmokeJava')
    classpath = sourceSets.smoke.runtimeClasspath
    mainClass = 'com.vandorlabs.neoforge.NativeFlatWallModelChecks'
}
tasks.register('testNativePanelGroups', JavaExec) {
    dependsOn tasks.named('compileSmokeJava')
    classpath = sourceSets.smoke.runtimeClasspath
    mainClass = 'com.vandorlabs.neoforge.shape.NativePanelGroupsChecks'
}

tasks.register('testNativeMaterialPlayback', JavaExec) {
    dependsOn tasks.named('compileSmokeJava'), tasks.named('generateCubeResources')
    classpath = sourceSets.smoke.runtimeClasspath
    mainClass = 'com.vandorlabs.neoforge.client.MaterialPlaybackChecks'
    args file('../..').absolutePath, file('build/generated/cube-resources/assets/vandorlabs').absolutePath
}

tasks.register('testNativePanelApertures', JavaExec) {
    group = 'verification'
    dependsOn tasks.named('compileSmokeJava')
    classpath = sourceSets.smoke.runtimeClasspath
    mainClass = 'com.vandorlabs.neoforge.NativePanelApertureChecks'
    maxHeapSize = '1G'
    args file(project.findProperty('panelApertureReference') ?: '../../build/test-artifacts/panel-aperture-forge.jsonl').absolutePath
}
