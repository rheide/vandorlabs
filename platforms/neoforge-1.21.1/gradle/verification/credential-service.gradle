tasks.named('generateCubeResources') {
    inputs.file('generate_credential_resources.py')
    inputs.file('../../src/portable/java/com/vandorlabs/credentials/CredentialCatalog.java')
    inputs.files(fileTree('../../src/main/resources/assets/vandorlabs/models/item') { include 'access_card_*.json', 'data_chip_*.json' })
    inputs.files(fileTree('../../texture-packs/additional/assets/vandorlabs/textures/items') { include 'access_card_*.png', 'data_chip_*.png' })
}
neoForge.runs.configureEach {
    if (project.hasProperty('credentialStackReference')) systemProperty 'vandorlabs.credentialStackReference', file(project.property('credentialStackReference')).absolutePath
}

tasks.named('generateMatterResources') {
    inputs.file('generate_credential_resources.py')
    inputs.file('../../src/portable/java/com/vandorlabs/credentials/CredentialCatalog.java')
}

def credentialPython = project.findProperty('pythonExecutable') ?: (System.getProperty('os.name').toLowerCase().contains('windows') ? 'python' : 'python3')
tasks.register('testNativeCredentialResources', Exec) {
    workingDir projectDir
    commandLine credentialPython, 'test_credential_resources.py'
}
tasks.named('check') { dependsOn 'testNativeCredentialResources' }
