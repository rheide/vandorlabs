neoForge.runs.configureEach {
    if (project.hasProperty('credentialReaderReference')) systemProperty 'vandorlabs.credentialReaderReference', file(project.property('credentialReaderReference')).absolutePath
    if (project.hasProperty('standaloneReaderReference')) systemProperty 'vandorlabs.standaloneReaderReference', file(project.property('standaloneReaderReference')).absolutePath
    if (project.hasProperty('standaloneReaderEditorReference')) systemProperty 'vandorlabs.standaloneReaderEditorReference', file(project.property('standaloneReaderEditorReference')).absolutePath
    if (project.hasProperty('standaloneReaderItemReference')) systemProperty 'vandorlabs.standaloneReaderItemReference', file(project.property('standaloneReaderItemReference')).absolutePath
}
