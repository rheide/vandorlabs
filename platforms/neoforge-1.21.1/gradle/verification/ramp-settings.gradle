tasks.register('testRampSettingsReference',JavaExec) {
 dependsOn tasks.named('compileSmokeJava')
 classpath=sourceSets.smoke.runtimeClasspath
 mainClass='com.vandorlabs.neoforge.ramp.NativeRampSettingsChecks'
 args rootProject.file('../../testclient/fixtures/ramp-settings-source.jsonl.gz').absolutePath
 maxHeapSize='1g'
}
neoForge.runs.configureEach {
 if(project.hasProperty('rampSettingsReference'))systemProperty 'vandorlabs.rampSettingsReference',file(project.property('rampSettingsReference')).absolutePath
}
tasks.register('testRampAdmissionReference',JavaExec) {
 dependsOn tasks.named('compileSmokeJava')
 classpath=sourceSets.smoke.runtimeClasspath
 mainClass='com.vandorlabs.neoforge.ramp.NativeRampAdmissionChecks'
 args rootProject.file('../../testclient/fixtures/ramp-admission-source.jsonl.gz').absolutePath,rootProject.file('../../testclient/fixtures/ramp-callbacks-source.jsonl.gz').absolutePath
 maxHeapSize='1g'
}
tasks.register('testRampGeometryReference',JavaExec) {
 dependsOn tasks.named('compileSmokeJava')
 classpath=sourceSets.smoke.runtimeClasspath
 mainClass='com.vandorlabs.neoforge.ramp.NativeRampGeometryChecks'
 args rootProject.file('../../testclient/fixtures/ramp-generation-source.jsonl.gz').absolutePath
 maxHeapSize='1g'
}
