tasks.register('testNativeDoorBounds', JavaExec) {
    group = 'verification'
    dependsOn tasks.named('smokeClasses')
    classpath = sourceSets.smoke.runtimeClasspath
    mainClass = 'com.vandorlabs.neoforge.door.NativeDoorBoundsChecks'
    args project.findProperty('doorBoundsReference') ?: '../../build/test-artifacts/door-bounds-forge.jsonl'
}

tasks.register('testNativeDoorRays', JavaExec) {
    group = 'verification'
    dependsOn tasks.named('smokeClasses')
    classpath = sourceSets.smoke.runtimeClasspath
    mainClass = 'com.vandorlabs.neoforge.door.NativeDoorRayChecks'
    args project.findProperty('doorRayReference') ?: '../../build/test-artifacts/door-rays-forge.jsonl'
    maxHeapSize = '1g'
}

tasks.register('testNativeDoorMesh', JavaExec) {
    group = 'verification'
    dependsOn tasks.named('smokeClasses')
    classpath = sourceSets.smoke.runtimeClasspath
    mainClass = 'com.vandorlabs.neoforge.NativeDoorMeshChecks'
}

neoForge.runs.configureEach {
    if (project.hasProperty('doorArtworkReference')) systemProperty 'vandorlabs.doorArtworkReference', file(project.property('doorArtworkReference')).absolutePath
}
