tasks.register('testRampFaceReference',JavaExec) {
 dependsOn tasks.named('compileSmokeJava')
 classpath=sourceSets.smoke.runtimeClasspath
 mainClass='com.vandorlabs.neoforge.ramp.NativeRampFaceChecks'
 args rootProject.file('../../testclient/fixtures/ramp-face-source.jsonl.gz').absolutePath
 maxHeapSize='512m'
}
