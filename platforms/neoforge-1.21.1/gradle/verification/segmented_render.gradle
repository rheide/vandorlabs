def segmentedPython = project.findProperty('pythonExecutable') ?: (System.getProperty('os.name').toLowerCase().contains('windows') ? 'python' : 'python3')
tasks.register('generateSegmentedResources', Exec) {
    workingDir projectDir
    commandLine segmentedPython, 'generate_segmented_resources.py'
    inputs.file('generate_segmented_resources.py')
    inputs.file('../../src/main/resources/assets/vandorlabs/models/item/segmented_door.json')
    inputs.file('../../src/main/resources/assets/vandorlabs/recipes/segmented_door.json')
    inputs.file('../../texture-packs/additional/assets/vandorlabs/textures/blocks/segmented/segmented_panel.png')
    inputs.dir('../../src/main/resources/assets/vandorlabs/models/block/segmented_gates')
    inputs.dir('../../texture-packs/additional/assets/vandorlabs/textures/blocks/segmented_gates')
    inputs.dir('../../texture-packs/additional/assets/vandorlabs/textures/blocks/segmented_doors')
    outputs.dir('build/generated/segmented-resources')
}
sourceSets.main.resources.srcDir('build/generated/segmented-resources')
tasks.named('processResources') { dependsOn 'generateSegmentedResources' }
tasks.register('testNativeSegmentedFast', JavaExec) {
    group = 'verification'
    dependsOn tasks.named('smokeClasses')
    classpath = sourceSets.smoke.runtimeClasspath
    mainClass = 'com.vandorlabs.neoforge.NativeSegmentedFastChecks'
    args file('../../build/test-artifacts/segmented-fast-forge.jsonl').absolutePath,
         file('../../build/test-artifacts/segmented-panels-forge.jsonl').absolutePath
}
