tasks.register('testNativeTrapdoorSettings', JavaExec) {
    group = 'verification'
    dependsOn tasks.named('smokeClasses')
    classpath = sourceSets.smoke.runtimeClasspath
    mainClass = 'com.vandorlabs.neoforge.trapdoor.TrapdoorSettingsChecks'
    args file('../../build/test-artifacts/trapdoor-settings-forge.json').absolutePath
}
