tasks.register('testNativeGlassPolicy', JavaExec) {
    group = 'verification'
    dependsOn tasks.named('smokeClasses')
    classpath = sourceSets.smoke.runtimeClasspath
    mainClass = 'com.vandorlabs.neoforge.glass.GlassPolicyChecks'
    args file('../../build/test-artifacts/programmable-glass-forge.jsonl').absolutePath
}
