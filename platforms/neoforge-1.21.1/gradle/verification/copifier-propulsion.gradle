tasks.register('testCopifierPropulsionReference',JavaExec) {
 dependsOn tasks.named('compileSmokeJava')
 classpath=sourceSets.smoke.runtimeClasspath
 mainClass='com.vandorlabs.neoforge.copifier.NativeCopifierPropulsionEditChecks'
 args rootProject.file('../../testclient/fixtures/copifier-propulsion-source.jsonl.gz').absolutePath
 maxHeapSize='1g'
}
neoForge.runs.configureEach {
 if(project.hasProperty('copifierPropulsionGroupReference'))systemProperty 'vandorlabs.copifierPropulsionGroupReference',file(project.property('copifierPropulsionGroupReference')).absolutePath
 if(project.hasProperty('copifierPropulsionReference'))systemProperty 'vandorlabs.copifierPropulsionReference',file(project.property('copifierPropulsionReference')).absolutePath
}
