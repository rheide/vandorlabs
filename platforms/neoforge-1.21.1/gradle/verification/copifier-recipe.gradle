neoForge.runs.configureEach {
 if(project.hasProperty('copifierRecipeConfigured'))systemProperty 'vandorlabs.copifierRecipeConfigured',project.property('copifierRecipeConfigured')
 if(project.hasProperty('copifierRecipeReference'))systemProperty 'vandorlabs.copifierRecipeReference',file(project.property('copifierRecipeReference')).absolutePath
}

tasks.register('testCopifierCanopyItemReference',JavaExec) {
 dependsOn tasks.named('compileSmokeJava')
 classpath=sourceSets.smoke.runtimeClasspath
 mainClass='com.vandorlabs.neoforge.copifier.CanopyCraftingEditChecks'
 args file('../../testclient/fixtures/copifier-recipe-configured-source.json.gz').absolutePath
 maxHeapSize='512m'
}

tasks.register('testCopifierRampItemReference',JavaExec) {
 dependsOn tasks.named('compileSmokeJava')
 classpath=sourceSets.smoke.runtimeClasspath
 mainClass='com.vandorlabs.neoforge.copifier.RampCraftingEditChecks'
 args file('../../testclient/fixtures/copifier-recipe-configured-source.json.gz').absolutePath
 maxHeapSize='512m'
}
