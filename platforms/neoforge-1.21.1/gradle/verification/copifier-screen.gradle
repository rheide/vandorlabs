tasks.register('testCopifierScreenReference',JavaExec) {
 dependsOn tasks.named('compileSmokeJava')
 classpath=sourceSets.smoke.runtimeClasspath
 mainClass='com.vandorlabs.neoforge.copifier.NativeCopifierScreenEditChecks'
 args rootProject.file('../../testclient/fixtures/copifier-screen-source.jsonl.gz').absolutePath
 maxHeapSize='1g'
}

neoForge.runs.configureEach {
 if(project.hasProperty('copifierScreenReference'))systemProperty 'vandorlabs.copifierScreenReference',file(project.property('copifierScreenReference')).absolutePath
}
