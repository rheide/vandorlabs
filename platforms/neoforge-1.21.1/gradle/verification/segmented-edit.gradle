    classpath = sourceSets.smoke.runtimeClasspath
    mainClass = 'com.vandorlabs.neoforge.segmented.SegmentedMaterialsChecks'
    args file('../../build/test-artifacts/segmented-materials-forge.json').absolutePath
}
