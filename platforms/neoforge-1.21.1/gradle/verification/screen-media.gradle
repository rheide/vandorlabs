def screenMediaPython = project.findProperty('pythonExecutable') ?: (System.getProperty('os.name').toLowerCase().contains('windows') ? 'python' : 'python3')
sourceSets.main.resources.srcDir('build/generated/screen-media-resources')
tasks.register('generateScreenMediaResources', Exec) {
    dependsOn tasks.named('generateCubeResources'),tasks.named('generateScreenCatalog')
    workingDir projectDir
    commandLine screenMediaPython,'generate_screen_media_resources.py'
    inputs.files('generate_screen_media_resources.py','material_playback_resources.py')
    inputs.files('build/generated/cube-resources/assets/vandorlabs/data/housing_finishes.json','build/generated/screen-resources/assets/vandorlabs/data/screen_catalog.json','../../generated-resources/assets/vandorlabs/data/unified_textures.json')
    inputs.files(fileTree('../../src/main/resources/assets/vandorlabs/textures/blocks/console_inputs'),fileTree('../../texture-packs/default/assets/vandorlabs/textures/blocks/console_inputs'),fileTree('../../texture-packs/additional/assets/vandorlabs/textures/blocks/console_inputs'))
    outputs.dir('build/generated/screen-media-resources')
}
tasks.named('processResources') { dependsOn tasks.named('generateScreenMediaResources') }

tasks.register('testNativeScreenMedia', JavaExec) {
    dependsOn tasks.named('compileSmokeJava'),tasks.named('generateScreenMediaResources')
    classpath = sourceSets.smoke.runtimeClasspath
    mainClass = 'com.vandorlabs.neoforge.screen.ScreenMediaChecks'
    args file('../..').absolutePath,file('build/generated/cube-resources/assets/vandorlabs').absolutePath,file('build/generated/screen-media-resources/assets/vandorlabs').absolutePath
}

tasks.register('testNativeScreenRenderPlan', JavaExec) {
    dependsOn tasks.named('compileSmokeJava'),tasks.named('generateScreenMediaResources')
    classpath = sourceSets.smoke.runtimeClasspath
    mainClass = 'com.vandorlabs.neoforge.screen.ScreenRenderPlanChecks'
    args file('../../testclient/fixtures/screen-role-gl-reference.json').absolutePath,file('../../testclient/fixtures/screen-role-light-reference.json.gz').absolutePath
}

tasks.register('testNativeScreenRenderPlanActivation', JavaExec) {
    dependsOn tasks.named('compileSmokeJava'),tasks.named('generateScreenMediaResources')
    classpath = sourceSets.smoke.runtimeClasspath
    mainClass = 'com.vandorlabs.neoforge.screen.ScreenRenderPlanChecks'
    args file('../../testclient/fixtures/screen-role-gl-activation-reference.json').absolutePath,file('../../testclient/fixtures/screen-role-light-activation-reference.json.gz').absolutePath,'true'
}

tasks.register('testNativeScreenMesh', JavaExec) {
    dependsOn tasks.named('compileSmokeJava')
    classpath = sourceSets.smoke.runtimeClasspath
    mainClass = 'com.vandorlabs.neoforge.NativeScreenMeshChecks'
    args file('../../testclient/fixtures/screen-role-geometry-reference.json.gz').absolutePath,file('../../testclient/fixtures/screen-role-gl-reference.json').absolutePath
}

tasks.register('testNativeScreenRenderGroups', JavaExec) {
    dependsOn tasks.named('compileSmokeJava')
    classpath = sourceSets.smoke.runtimeClasspath
    mainClass = 'com.vandorlabs.neoforge.screen.ScreenRenderGroupChecks'
    args file('../../testclient/fixtures/screen-render-groups-reference.json.gz').absolutePath
}

neoForge.runs.configureEach {
    if(project.hasProperty('screenRenderGroupsCheck')) {
        systemProperty 'vandorlabs.screenRenderGroupsCheck','true'
        systemProperty 'screenRenderGroupsReference',file('../../testclient/fixtures/screen-render-groups-reference.json.gz').absolutePath
    }
}

tasks.register('testNativeScreenRenderQueries', JavaExec) {
    dependsOn tasks.named('compileSmokeJava')
    classpath = sourceSets.smoke.runtimeClasspath
    mainClass = 'com.vandorlabs.neoforge.screen.ScreenRenderQueryChecks'
    args file('../../testclient/fixtures/screen-role-gl-reference.json').absolutePath,file('../../testclient/fixtures/screen-role-gl-activation-reference.json').absolutePath
}
