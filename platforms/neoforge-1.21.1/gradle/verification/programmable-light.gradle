tasks.register('testNativeLightFoundation', JavaExec) {
    dependsOn tasks.named('compileSmokeJava')
    classpath = sourceSets.smoke.runtimeClasspath
    mainClass = 'com.vandorlabs.neoforge.light.LightFoundationChecks'
    args rootProject.file('../../build/test-artifacts/programmable-light-settings-forge.jsonl').absolutePath,
         rootProject.file('../../build/test-artifacts/programmable-light-policy-forge.jsonl').absolutePath,
         rootProject.file('../../build/test-artifacts/programmable-light-interaction-forge.jsonl').absolutePath
}
tasks.register('testNativeLightJoining', JavaExec) {
    dependsOn tasks.named('compileSmokeJava')
    classpath = sourceSets.smoke.runtimeClasspath
    mainClass = 'com.vandorlabs.neoforge.light.LightJoiningChecks'
    maxHeapSize = '1G'
    args rootProject.file('../../build/test-artifacts/light-joining-forge.jsonl').absolutePath
}
tasks.register('testNativeLightGeometry', JavaExec) {
    dependsOn tasks.named('compileSmokeJava')
    classpath = sourceSets.smoke.runtimeClasspath
    mainClass = 'com.vandorlabs.neoforge.light.LightGeometryChecks'
    args rootProject.file('../../build/test-artifacts/light-geometry-forge.jsonl').absolutePath
}
