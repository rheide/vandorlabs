tasks.register('testNativeRampRiderPolicy', JavaExec) {
    dependsOn tasks.named('compileSmokeJava')
    classpath = sourceSets.smoke.runtimeClasspath
    mainClass = 'com.vandorlabs.neoforge.ramp.NativeRampRiderPolicyChecks'
    args file('../../testclient/fixtures/platform-riders-source.jsonl.gz').absolutePath
    maxHeapSize = '512m'
}

