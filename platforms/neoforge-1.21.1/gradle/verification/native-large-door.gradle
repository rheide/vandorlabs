neoForge.runs.configureEach {
    if (project.hasProperty('largeDoorGushReference')) systemProperty 'vandorlabs.largeDoorGushReference', file(project.property('largeDoorGushReference')).absolutePath
    if (project.hasProperty('largeDoorControlsReference')) systemProperty 'vandorlabs.largeDoorControlsReference', file(project.property('largeDoorControlsReference')).absolutePath
    if (project.hasProperty('largeDoorReference')) systemProperty 'vandorlabs.largeDoorReference', file(project.property('largeDoorReference')).absolutePath
}

tasks.register('testNativeLargeDoorGeometry', JavaExec) {
    dependsOn tasks.named('compileSmokeJava')
    classpath = sourceSets.smoke.runtimeClasspath
    mainClass = 'com.vandorlabs.neoforge.door.LargeDoorGeometryChecks'
    maxHeapSize = '1G'
    args rootProject.file('../../build/test-artifacts/large-door-geometry-forge.jsonl').absolutePath
}
