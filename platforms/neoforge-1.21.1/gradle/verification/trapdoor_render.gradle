tasks.register('testNativeTrapdoorGeometry', JavaExec) {
    group = 'verification'
    dependsOn tasks.named('smokeClasses')
    classpath = sourceSets.smoke.runtimeClasspath
    mainClass = 'com.vandorlabs.neoforge.trapdoor.TrapdoorGeometryChecks'
    args file('../../build/test-artifacts/trapdoor-geometry-forge.jsonl').absolutePath
}

tasks.register('testNativeTrapdoorMesh', JavaExec) {
